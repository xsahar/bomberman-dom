<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>WebSocket Chat Test</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f4f4f4; padding:18px; }
    #container { max-width:720px; margin:0 auto; background:#fff; padding:12px; border-radius:6px; box-shadow:0 2px 8px rgba(0,0,0,0.08); }
    #messages { height:300px; overflow:auto; border:1px solid #ddd; padding:8px; background:#fafafa; }
    .msg { margin:6px 0; }
    .author { font-weight:700; margin-right:6px; }
    .ts { color:#888; font-size:12px; margin-left:6px; }
    input[type=text] { padding:8px; width:100%; box-sizing:border-box; }
    .controls { display:flex; gap:8px; margin-top:8px; }
    .controls > * { flex:1; }
  </style>
</head>
<body>
  <div id="container">
    <h2>WebSocket Chat Test</h2>

    <label>Server URL (host only): <input id="host" type="text" value="localhost:8081"></label>
    <div style="margin-top:8px; display:flex; gap:8px;">
      <input id="nick" type="text" placeholder="Your nickname" value="Player">
      <button id="connect">Connect</button>
      <button id="disconnect" disabled>Disconnect</button>
    </div>

    <h4 style="margin-top:12px;">Messages</h4>
    <div id="messages"></div>

    <div class="controls">
      <input id="text" type="text" placeholder="Type a message and press Send or Enter">
      <button id="send">Send</button>
    </div>
  </div>

  <script>
    let ws = null;
    const messagesEl = document.getElementById('messages');
    const hostEl = document.getElementById('host');
    const nickEl = document.getElementById('nick');
    const connectBtn = document.getElementById('connect');
    const disconnectBtn = document.getElementById('disconnect');
    const sendBtn = document.getElementById('send');
    const textEl = document.getElementById('text');

    function appendMessage(author, text, ts) {
      const d = new Date(ts || Date.now());
      const el = document.createElement('div');
      el.className = 'msg';
      el.innerHTML = '<span class="author">' + escapeHtml(author) + '</span>' +
                     '<span class="text">' + escapeHtml(text) + '</span>' +
                     '<span class="ts">' + d.toLocaleTimeString() + '</span>';
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');
    }

    function connect() {
      const host = hostEl.value.trim() || 'localhost:8081';
      const protocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
      const url = protocol + host + (host.indexOf('/ws') === -1 ? '/ws' : '');
      appendMessage('SYSTEM', 'Connecting to ' + url + ' ...', Date.now());
      ws = new WebSocket(url);

      ws.addEventListener('open', () => {
        appendMessage('SYSTEM', 'Connected', Date.now());
        connectBtn.disabled = true; disconnectBtn.disabled = false;
      });

      ws.addEventListener('message', (e) => {
        try {
          const data = JSON.parse(e.data);
          if (data.type === 'chat' && data.payload) {
            appendMessage(data.payload.author || 'unknown', data.payload.text || '', data.payload.ts || Date.now());
          } else if (data.type === 'chatHistory' && Array.isArray(data.payload)) {
            data.payload.forEach(m => appendMessage(m.author || 'unknown', m.text || '', m.ts || Date.now()));
          } else {
            appendMessage('RECV', e.data, Date.now());
          }
        } catch (err) {
          appendMessage('ERROR', 'Invalid JSON: ' + e.data, Date.now());
        }
      });

      ws.addEventListener('close', () => {
        appendMessage('SYSTEM', 'Disconnected', Date.now());
        connectBtn.disabled = false; disconnectBtn.disabled = true;
      });

      ws.addEventListener('error', (err) => {
        appendMessage('SYSTEM', 'WebSocket error', Date.now());
        console.error(err);
      });
    }

    function disconnect() {
      if (!ws) return;
      ws.close();
      ws = null;
    }

    function sendMessage() {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        appendMessage('SYSTEM', 'Not connected', Date.now());
        return;
      }
      const payload = { author: nickEl.value || 'Player', text: textEl.value || '', ts: Date.now() };
      ws.send(JSON.stringify({ type: 'chat', payload }));
      textEl.value = '';
    }

    connectBtn.addEventListener('click', connect);
    disconnectBtn.addEventListener('click', disconnect);
    sendBtn.addEventListener('click', sendMessage);
    textEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
  </script>
</body>
</html>
